<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý thi</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="top">
  <div><h1 id="appName">QUẢN LÝ THI</h1><small>Trang quản lý · bảng điểm và thống kê</small></div>
  <div class="row"><a id="sheetLink" class="hidden" target="_blank" style="color:#fff;font-size:13px">Mở Google Sheet</a>
  <button class="btn-ghost hidden" id="btnReload">Tải lại</button></div>
</div>
<div class="wrap wide">
  <section id="scPass" class="card" style="max-width:420px;margin:40px auto">
    <h2>Đăng nhập quản lý</h2>
    <form id="fPass" class="row"><input type="password" id="pass" class="grow" placeholder="Mật khẩu quản lý" required><button class="btn">Xem</button></form>
    <div id="errPass" class="err hidden"></div>
  </section>

  <section id="scMain" class="hidden">
    <div class="stats" id="overview" style="margin:0 0 16px"></div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="tabs" style="margin:0">
          <button class="tab on" data-tab="cham">Chấm bài theo phần</button>
          <button class="tab" data-tab="rank">Bảng điểm & xếp hạng</button>
          <button class="tab" data-tab="hard">Câu sai nhiều nhất</button>
          <button class="tab" data-tab="who">Ai sai cái gì</button>
          <button class="tab" data-tab="log">Lịch sử thi</button>
        </div>
        <div class="row">
          <label id="lbPhan" class="hidden">Phần <select id="fPhan" style="width:auto"></select></label>
          <label>Nhóm <select id="fNhom" style="width:auto"></select></label>
          <button class="btn-ghost" id="btnAuto" title="Dùng sau khi sửa đáp án trong tab CAU_HOI: cập nhật gợi ý Đúng/Sai của máy cho mọi bài (không đổi điểm bạn đã chấm)">Cập nhật gợi ý TN theo đáp án mới</button>
        </div>
      </div>
      <div id="tabBody"></div>
    </div>
  </section>
</div>
<div class="bar-bottom hidden" id="barBai"><div class="inner" style="max-width:1200px">
  <div id="barSum" class="row"></div>
  <div class="row"><span id="barMsg" style="font-size:13px"></span>
    <button class="btn-ghost" id="btnSave">Lưu điểm</button><button class="btn" id="btnSaveNext">Lưu &amp; sang bài tiếp →</button></div>
</div></div>

<script>
(function () {
  var C = window.APP_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var D = null, tab = 'cham', sortState = {};
  var phanCham = '', loc = 'all', timTen = '';   // trạng thái màn danh sách chấm
  var B = null, dirty = false, dsHienTai = [];   // bài đang chấm
  $('appName').textContent = 'QUẢN LÝ · ' + (C.TEN_CHUONG_TRINH || 'THI');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function f(n) { return n == null || isNaN(n) ? '—' : (Math.round(n * 100) / 100).toString().replace('.', ','); }
  function dt(ms) { if (!ms) return ''; var d = new Date(ms); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); }
  function isDat(kq) { return String(kq || '').indexOf('ĐẠT') === 0; }
  function isCho(kq) { return String(kq || '').indexOf('CHỜ') === 0; }
  function pass() { try { return sessionStorage.getItem('admin_pass') || ''; } catch (e) { return ''; } }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

  function api(data) {
    return fetch(C.API_URL, { method: 'POST', body: JSON.stringify(data), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j; });
  }

  function load(pw) {
    return api({ action: 'admin', password: pw }).then(function (r) {
      D = r;
      try { sessionStorage.setItem('admin_pass', pw); } catch (e) {}
      $('sheetLink').href = r.sheetUrl; $('sheetLink').classList.remove('hidden');
      $('btnReload').classList.remove('hidden');
      fillFilters(); render();
      $('scPass').classList.add('hidden'); $('scMain').classList.remove('hidden');
    });
  }
  function reloadData() { return api({ action: 'admin', password: pass() }).then(function (r) { D = r; renderOverview(); }); }

  $('fPass').onsubmit = function (e) {
    e.preventDefault();
    $('errPass').classList.add('hidden');
    load($('pass').value).catch(function (ex) { $('errPass').textContent = ex.message; $('errPass').classList.remove('hidden'); });
  };
  $('btnReload').onclick = function () { if (!confirmBo()) return; B = null; var p = pass(); if (p) load(p).catch(function (ex) { alert(ex.message); }); };
  $('btnAuto').onclick = function () {
    var btn = this;
    if (!confirm('Cập nhật gợi ý Đúng/Sai của máy cho phần trắc nghiệm của TẤT CẢ bài theo đáp án hiện tại trong tab CAU_HOI. Điểm bạn đã chấm giữ nguyên. Tiếp tục?')) return;
    btn.disabled = true; btn.textContent = 'Đang chấm lại...';
    api({ action: 'tinhLai', password: pass() }).then(function (r) {
      return reloadData().then(function () { B = null; render(); alert('Đã cập nhật ' + r.n + ' bài.'); });
    }).catch(function (ex) { alert(ex.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Cập nhật gợi ý TN theo đáp án mới'; });
  };
  var saved = pass();
  if (saved) load(saved).catch(function () {});
  window.addEventListener('beforeunload', function (e) { if (B && dirty) { e.preventDefault(); e.returnValue = ''; } });
  function confirmBo() { return !(B && dirty) || confirm('Bài này còn điểm chưa lưu. Bỏ qua thay đổi?'); }

  function fillFilters() {
    var keepP = $('fPhan').value, keepN = $('fNhom').value;
    $('fPhan').innerHTML = '<option value="">Tất cả phần</option>' + phansMo().map(function (p) { return '<option value="' + esc(p.ma) + '">' + esc(p.ma + '. ' + p.ten) + '</option>'; }).join('');
    var nhoms = {}; D.nhanVien.forEach(function (n) { if (n.nhom) nhoms[n.nhom] = 1; });
    $('fNhom').innerHTML = '<option value="">Tất cả nhóm</option>' + Object.keys(nhoms).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    $('fPhan').value = keepP; $('fNhom').value = keepN;
  }
  $('fPhan').onchange = render; $('fNhom').onchange = function () { if (B) { render(); } else render(); };
  each('.tab', function (b) {
    b.onclick = function () {
      if (!confirmBo()) return;
      tab = b.getAttribute('data-tab'); B = null;
      each('.tab', function (x) { x.classList.toggle('on', x === b); });
      render();
    };
  });

  function phansMo() { return D.phans.filter(function (p) { return p.mo || D.ketQua.some(function (k) { return k.phan === p.ma; }); }); }
  function phansSel() { var v = $('fPhan').value; return D.phans.filter(function (p) { return (v ? p.ma === v : p.mo); }); }
  function nvSel() { var n = $('fNhom').value; return D.nhanVien.filter(function (x) { return !n || x.nhom === n; }); }
  function kqOf(ma, phan) { return D.ketQua.filter(function (k) { return k.ma.toUpperCase() === ma.toUpperCase() && (!phan || k.phan === phan); }); }
  function best(list) { var b = null; list.forEach(function (k) { if (k.tong != null && (b == null || k.tong > b)) b = k.tong; }); return b; }
  function nvMap() { var m = {}; D.nhanVien.forEach(function (n) { m[n.ma.toUpperCase()] = n; }); return m; }

  function render() {
    renderOverview();
    $('lbPhan').classList.toggle('hidden', tab === 'cham');
    $('barBai').classList.add('hidden');
    if (tab === 'cham') { if (B) renderBai(); else renderDs(); return; }
    var fn = { rank: tRank, hard: tHard, who: tWho, log: tLog }[tab];
    $('tabBody').innerHTML = fn();
    bindSort();
    if (tab === 'who') { $('whoSel').onchange = function () { $('whoBody').innerHTML = whoBody($('whoSel').value); }; }
    if (tab === 'hard') {
      each('[data-cau]', function (tr) {
        tr.style.cursor = 'pointer';
        tr.onclick = function () { var d = $('det-' + tr.getAttribute('data-cau')); d.classList.toggle('hidden'); };
      });
    }
  }

  function renderOverview() {
    var nvs = nvSel(), phans = D.phans.filter(function (p) { return p.mo; }), maSet = {};
    nvs.forEach(function (n) { maSet[n.ma.toUpperCase()] = 1; });
    var kq = D.ketQua.filter(function (k) { return maSet[k.ma.toUpperCase()] && phans.some(function (p) { return p.ma === k.phan; }); });
    var daThi = {};
    kq.forEach(function (k) { daThi[k.ma.toUpperCase() + '|' + k.phan] = 1; });
    var cho = kq.filter(function (k) { return isCho(k.kq); }).length;
    $('overview').innerHTML =
      '<div class="stat">Nhân sự<b>' + nvs.length + '</b></div>' +
      '<div class="stat">Bài đã nộp<b>' + kq.length + '</b></div>' +
      '<div class="stat">Bài chờ chấm<b style="color:var(--amber)">' + cho + '</b></div>' +
      '<div class="stat">Đã thi (người × phần)<b>' + Object.keys(daThi).length + '/' + nvs.length * phans.length + '</b></div>';
  }

  // =================== CHẤM BÀI: DANH SÁCH THEO PHẦN ===================
  function renderDs() {
    var mo = phansMo();
    if (!phanCham || !mo.some(function (p) { return p.ma === phanCham; })) phanCham = mo.length ? mo[0].ma : '';
    var nvs = nvSel(), maSet = {}, nm = nvMap();
    nvs.forEach(function (n) { maSet[n.ma.toUpperCase()] = 1; });
    var cards = mo.map(function (p) {
      var kq = D.ketQua.filter(function (k) { return k.phan === p.ma && maSet[k.ma.toUpperCase()]; });
      var nguoi = {}; kq.forEach(function (k) { nguoi[k.ma.toUpperCase()] = 1; });
      var cho = kq.filter(function (k) { return isCho(k.kq); }).length;
      return '<button class="pcard' + (p.ma === phanCham ? ' on' : '') + '" data-p="' + esc(p.ma) + '">' +
        '<div class="pc-ma">' + esc(p.ma) + ' · ' + p.phut + ' phút</div><div class="pc-ten">' + esc(p.ten) + '</div>' +
        '<div class="pc-num"><span><b>' + Object.keys(nguoi).length + '</b>/' + nvs.length + ' người đã thi</span>' +
        (cho ? '<span class="badge b-amber">' + cho + ' bài chờ chấm</span>' : (kq.length ? '<span class="badge b-green">Đã chấm hết</span>' : '')) + '</div></button>';
    }).join('');

    var kqP = D.ketQua.filter(function (k) { return k.phan === phanCham && maSet[k.ma.toUpperCase()]; });
    var thi = {}; kqP.forEach(function (k) { thi[k.ma.toUpperCase()] = 1; });
    var chuaThi = nvs.filter(function (n) { return !thi[n.ma.toUpperCase()]; });
    var dem = { all: kqP.length + chuaThi.length, cho: kqP.filter(function (k) { return isCho(k.kq); }).length, xong: kqP.filter(function (k) { return !isCho(k.kq); }).length, chua: chuaThi.length };
    var q = timTen.trim().toLowerCase();
    var hop = function (ma, ten) { return !q || String(ma).toLowerCase().indexOf(q) >= 0 || String(ten).toLowerCase().indexOf(q) >= 0; };
    var bai = kqP.filter(function (k) { return hop(k.ma, k.ten) && (loc === 'all' || (loc === 'cho' && isCho(k.kq)) || (loc === 'xong' && !isCho(k.kq))); })
      .sort(function (a, b) { return ((isCho(b.kq) ? 1 : 0) - (isCho(a.kq) ? 1 : 0)) || ((b.tg || 0) - (a.tg || 0)); });
    var chua = (loc === 'all' || loc === 'chua') ? chuaThi.filter(function (n) { return hop(n.ma, n.ten); }) : [];
    dsHienTai = bai.map(function (k) { return k.maBai; });

    var chip = function (v, t) { return '<button class="chip' + (loc === v ? ' on' : '') + '" data-loc="' + v + '">' + t + ' <b>' + dem[v] + '</b></button>'; };
    var rows = bai.map(function (k, i) {
      var nv = nm[k.ma.toUpperCase()] || {};
      var st = isCho(k.kq) ? '<span class="badge b-amber">Chờ chấm</span>' : '<span class="badge ' + (isDat(k.kq) ? 'b-green' : 'b-red') + '">' + esc(k.kq) + '</span>';
      return '<tr class="click" data-bai="' + esc(k.maBai) + '"><td>' + (i + 1) + '</td><td><b>' + esc(k.ten) + '</b><div class="muted" style="font-size:12px">' + esc(k.ma) + '</div></td>' +
        '<td>' + esc(k.nhom) + '<div class="muted" style="font-size:12px">' + esc(nv.duAn || '') + '</div></td><td>Lần ' + k.lan + '</td><td>' + dt(k.tg) + '<div class="muted" style="font-size:12px">' + f(k.phut) + ' phút</div></td>' +
        '<td>' + f(k.tn) + '</td><td>' + f(k.tl) + '</td><td><b>' + f(k.tong) + '</b></td><td>' + st + '</td>' +
        '<td><button class="btn btn-sm">' + (isCho(k.kq) ? 'Chấm bài' : 'Xem / sửa') + '</button></td></tr>';
    }).join('') + chua.map(function (n) {
      return '<tr class="dim"><td></td><td><b>' + esc(n.ten) + '</b><div class="muted" style="font-size:12px">' + esc(n.ma) + '</div></td><td>' + esc(n.nhom) + '<div class="muted" style="font-size:12px">' + esc(n.duAn || '') + '</div></td>' +
        '<td colspan="7"><span class="badge b-gray">Chưa thi</span></td></tr>';
    }).join('');

    $('tabBody').innerHTML = '<div class="pcards">' + cards + '</div>' +
      '<div class="row" style="justify-content:space-between;margin:16px 0 10px">' +
      '<div class="row">' + chip('all', 'Tất cả') + chip('cho', 'Chờ chấm') + chip('xong', 'Đã chấm') + chip('chua', 'Chưa thi') + '</div>' +
      '<input type="text" id="timTen" placeholder="Tìm tên / mã NV..." style="max-width:260px" value="' + esc(timTen) + '"></div>' +
      (rows ? '<div class="scroll"><table><thead><tr><th>#</th><th>Người thi</th><th>Nhóm · Dự án</th><th>Lần</th><th>Nộp lúc</th><th>TN (/5)</th><th>TL (/5)</th><th>Tổng (/10)</th><th>Trạng thái</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<p class="muted">Không có ai trong mục này.</p>');

    each('.pcard', function (b) { b.onclick = function () { phanCham = b.getAttribute('data-p'); renderDs(); }; });
    each('.chip', function (b) { b.onclick = function () { loc = b.getAttribute('data-loc'); renderDs(); }; });
    each('tr[data-bai]', function (tr) { tr.onclick = function () { moBai(tr.getAttribute('data-bai')); }; });
    $('timTen').oninput = function () { timTen = this.value; var pos = this.selectionStart; renderDs(); $('timTen').focus(); $('timTen').setSelectionRange(pos, pos); };
  }

  // =================== CHẤM BÀI: MỘT BÀI ===================
  function moBai(maBai) {
    B = { loading: true, maBai: maBai }; dirty = false;
    renderBai();
    window.scrollTo(0, 0);
    api({ action: 'baiThi', password: pass(), maBai: maBai }).then(function (r) { setBai(r); renderBai(); })
      .catch(function (ex) { $('tabBody').innerHTML = '<button class="btn-ghost" id="btnBack">← Quay lại danh sách</button><div class="err">' + esc(ex.message) + '</div>'; $('btnBack').onclick = function () { B = null; render(); }; });
  }
  function setBai(r) {
    B = { maBai: r.bai.maBai, bai: r.bai, items: r.items };
    r.items.forEach(function (it) { it.v = it.diem; it.nx = it.nhanXet; });   // v = điểm người chấm (null = theo máy)
    dirty = false;
  }
  function diemCau(it) { return it.v; }   // mọi câu do người chấm quyết định, máy chỉ gợi ý
  function T() { return B.bai.thang || { maxTN: 5, maxTL: 5, moiTN: 1, moiTL: 1, truSai: 0.5 }; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function tamTinh() {
    var t = T();
    var tn = B.items.filter(function (x) { return x.loai === 'TN'; }), tl = B.items.filter(function (x) { return x.loai === 'TL'; });
    var chamTN = tn.filter(function (x) { return x.v != null; }), chamTL = tl.filter(function (x) { return x.v != null; });
    var dung = chamTN.filter(function (x) { return x.v >= 1; }).length, mot = chamTN.filter(function (x) { return x.v > 0 && x.v < 1; }).length;
    var sai = chamTN.length - dung - mot;
    var cong = chamTN.reduce(function (s, x) { return s + (x.v > 0 ? Math.min(1, x.v) : 0); }, 0);
    var dTN = Math.max(0, cong * t.moiTN - sai * t.truSai);
    var dTL = Math.min(t.maxTL, chamTL.reduce(function (s, x) { return s + x.v; }, 0));
    var xong = chamTN.length === tn.length && chamTL.length === tl.length;
    return { tn: r2(dTN), tl: r2(dTL), nTN: tn.length, nTL: tl.length, cTN: chamTN.length, cTL: chamTL.length, dung: dung, mot: mot, sai: sai,
      tong: xong ? r2((tn.length ? dTN : 0) + (tl.length ? dTL : 0)) : null, t: t };
  }

  function renderBai() {
    if (B.loading) { $('tabBody').innerHTML = '<div class="spinner"></div><p class="muted center">Đang mở bài thi...</p>'; return; }
    var b = B.bai, nv = nvMap()[b.ma.toUpperCase()] || {};
    var idx = dsHienTai.indexOf(B.maBai);
    var tn = B.items.filter(function (x) { return x.loai === 'TN'; }), tl = B.items.filter(function (x) { return x.loai === 'TL'; });
    var stt = 0;
    var h = '<div class="row" style="justify-content:space-between;margin-bottom:12px"><button class="btn-ghost" id="btnBack">← Danh sách ' + esc(b.phan) + '</button>' +
      '<div class="row">' + (idx > 0 ? '<button class="btn-ghost" id="btnPrev">← Bài trước</button>' : '') + (idx >= 0 && idx < dsHienTai.length - 1 ? '<button class="btn-ghost" id="btnNext">Bài sau →</button>' : '') + '</div></div>' +
      '<div class="baihead"><div><div class="bh-ten">' + esc(b.ten) + ' <span class="muted" style="font-size:14px;font-weight:400">(' + esc(b.ma) + ')</span></div>' +
      '<div class="muted">' + esc(b.nhom) + (nv.duAn ? ' · ' + esc(nv.duAn) : '') + '</div></div>' +
      '<div class="bh-meta"><b>' + esc(b.phan + '. ' + b.tenPhan) + '</b><br>Lần ' + b.lan + ' · Mã đề ' + esc(b.maDe) + ' · Nộp ' + dt(b.tg) + ' · Làm ' + f(b.phut) + ' phút</div></div>';

    if (tn.length) {
      var th = T();
      h += '<h3 class="sec">Phần trắc nghiệm <span class="muted">(' + tn.length + ' câu · tối đa ' + f(th.maxTN) + ' điểm · đúng +' + f(r2(th.moiTN)) + ' · sai −' + f(th.truSai) + ')</span></h3>' +
        '<p class="muted" style="font-size:13px;margin-top:-4px">Ô <span class="lg lg-ok">xanh lá</span> là đáp án trong Sheet · nhãn <b>“Thí sinh chọn”</b> là lựa chọn của người thi. Thứ tự A–D là thứ tự gốc, không phải thứ tự đã trộn trên đề. Đúng hết được cả điểm câu, chọn đúng một phần (không chọn nhầm) được theo tỷ lệ, chọn nhầm hoặc bỏ trống bị trừ. Máy chỉ <b>gợi ý</b>, điểm do bạn bấm mới được tính.</p>' +
        (tn.some(function (x) { return x.v == null && x.may != null; }) ? '<button class="btn-ghost btn-sm" id="btnTheoMay" style="margin-bottom:10px">Chấm theo gợi ý của máy cho các câu trắc nghiệm chưa chấm</button>' : '');
      tn.forEach(function (it) {
        stt++;
        var chon = String(it.traLoi || '').toUpperCase(), da = String(it.dapAn || '').toUpperCase();
        var opts = it.options.map(function (o, k) {
          if (!o) return '';
          var L = 'ABCD'.charAt(k), c = chon.indexOf(L) >= 0, d = da.indexOf(L) >= 0;
          var cls = c && d ? 'ok' : (c ? 'bad' : (d ? 'right' : ''));
          return '<div class="opt ro ' + cls + '"><span class="letter">' + L + '.</span><span>' + esc(o) + '</span><span class="tag">' +
            (c ? '<span class="badge b-blue">Thí sinh chọn</span> ' : '') + (d ? '<span class="badge b-green">Đáp án</span>' : '') + '</span></div>';
        }).join('');
        var nDA = da.replace(/[^A-D]/g, '').length;
        var mayTxt = it.may == null ? 'chưa có đáp án' : (it.may > 0 && it.may < 1 ? '<b style="color:var(--amber)">Đúng 1 phần (' + Math.round(it.may * nDA) + '/' + nDA + ')</b>' : it.may > 0 ? '<b style="color:var(--green)">Đúng</b>' : '<b style="color:var(--red)">Sai</b>');
        var d0 = it.v;
        h += '<div class="q" data-row="' + it.row + '"><div class="row" style="justify-content:space-between"><span class="num"><b>Câu ' + stt + '</b> <span class="muted" style="font-size:12px">' + esc(it.id) + '</span></span>' +
          '<span>' + (chon ? '' : '<span class="badge b-red">Bỏ trống</span> ') + (d0 == null ? '<span class="badge b-amber">Chưa chấm</span>' : (d0 > 0 ? '<span class="badge ' + (d0 >= 1 ? 'b-green' : 'b-amber') + '">' + (d0 >= 1 ? 'Đúng' : 'Đúng 1 phần') + ' · +' + f(r2(th.moiTN * Math.min(1, d0))) + '</span>' : '<span class="badge b-red">Sai · −' + f(th.truSai) + '</span>')) + '</span></div><div class="qh" style="margin-top:6px">' + esc(it.cauHoi) + '</div>' + opts +
          '<div class="grade"><span class="muted">Máy gợi ý: ' + mayTxt + '</span><span class="grow"></span>' +
          '<button class="seg' + (d0 != null && d0 >= 1 ? ' on-ok' : '') + '" data-set="1">✓ Đúng hết (+' + f(r2(th.moiTN)) + ')</button>' +
          (function () { var b = ''; for (var k = 1; k < nDA; k++) { var fr = r2(k / nDA); b += '<button class="seg' + (d0 === fr ? ' on-part' : '') + '" data-set="' + fr + '">Đúng ' + k + '/' + nDA + ' (+' + f(r2(th.moiTN * fr)) + ')</button>'; } return b; })() +
          '<button class="seg' + (d0 === 0 ? ' on-bad' : '') + '" data-set="0">✗ Sai (−' + f(th.truSai) + ')</button>' +
          (it.v != null ? '<button class="seg" data-set="">↺ Bỏ chấm</button>' : '') + '</div></div>';
      });
    }
    if (tl.length) {
      var tt = T(), mx = r2(tt.moiTL);
      var nut = []; for (var v = 0; v < mx - 0.01; v += 0.5) nut.push(r2(v)); nut.push(mx);
      h += '<h3 class="sec">Phần tự luận <span class="muted">(' + tl.length + ' câu · tối đa ' + f(tt.maxTL) + ' điểm · mỗi câu tối đa ' + f(mx) + ')</span></h3>';
      tl.forEach(function (it) {
        stt++;
        var d = diemCau(it);
        h += '<div class="q" data-row="' + it.row + '"><div class="row" style="justify-content:space-between"><span class="num"><b>Câu ' + stt + '</b> <span class="muted" style="font-size:12px">' + esc(it.id) + '</span></span>' +
          (d == null ? '<span class="badge b-amber">Chưa chấm</span>' : '<span class="badge b-green">' + f(d) + ' / ' + f(mx) + ' điểm</span>') + '</div>' +
          '<div class="qh" style="margin-top:6px">' + esc(it.cauHoi) + '</div>' +
          (it.huongDan ? '<details open class="hd"><summary>Hướng dẫn chấm / đáp án gợi ý</summary><div class="feedback">' + esc(it.huongDan) + '</div></details>' : '<div class="hint">Câu này chưa có hướng dẫn chấm.</div>') +
          '<div class="hint" style="margin-top:8px">Bài làm của thí sinh:</div><div class="answer-text">' + (esc(it.traLoi) || '<i class="muted">(bỏ trống)</i>') + '</div>' +
          '<div class="grade"><span class="muted">Điểm (tối đa ' + f(mx) + '):</span>' + nut.map(function (v) { return '<button class="seg' + (it.v === v ? ' on-sel' : '') + '" data-set="' + v + '">' + f(v) + '</button>'; }).join('') +
          '<input type="number" class="gDiem" data-max="' + mx + '" min="0" max="' + mx + '" step="0.05" value="' + (it.v == null ? '' : it.v) + '" placeholder="0-' + f(mx) + '">' +
          (it.v != null ? '<button class="seg" data-set="">↺ Bỏ chấm</button>' : '') +
          '<input type="text" class="gNx grow" placeholder="Nhận xét (không bắt buộc)" value="' + esc(it.nx) + '"></div></div>';
      });
    }
    $('tabBody').innerHTML = h;
    $('btnBack').onclick = function () { if (!confirmBo()) return; B = null; render(); };
    if ($('btnTheoMay')) $('btnTheoMay').onclick = function () {
      B.items.forEach(function (x) { if (x.loai === 'TN' && x.v == null && x.may != null) x.v = x.may; });
      dirty = true; var y = window.scrollY; renderBai(); window.scrollTo(0, y);
    };
    if ($('btnPrev')) $('btnPrev').onclick = function () { if (confirmBo()) moBai(dsHienTai[idx - 1]); };
    if ($('btnNext')) $('btnNext').onclick = function () { if (confirmBo()) moBai(dsHienTai[idx + 1]); };

    each('#tabBody .q[data-row]', function (card) {
      var it = B.items.filter(function (x) { return x.row === +card.getAttribute('data-row'); })[0];
      var setV = function (v) { it.v = v; dirty = true; var y = window.scrollY; renderBai(); window.scrollTo(0, y); };
      Array.prototype.forEach.call(card.querySelectorAll('[data-set]'), function (btn) {
        btn.onclick = function () { var s = btn.getAttribute('data-set'); setV(s === '' ? null : +s); };
      });
      var inp = card.querySelector('.gDiem');
      if (inp) inp.onchange = function () {
        var s = inp.value.trim().replace(',', '.'), mx = +inp.getAttribute('data-max');
        if (s === '') { setV(null); return; }
        var n = +s; if (isNaN(n) || n < 0 || n > mx + 0.001) { alert('Điểm câu này từ 0 đến ' + f(mx)); inp.value = it.v == null ? '' : it.v; return; }
        setV(r2(n));
      };
      var nx = card.querySelector('.gNx');
      if (nx) nx.oninput = function () { it.nx = nx.value; dirty = true; drawBar(); };
    });
    $('barBai').classList.remove('hidden');
    drawBar();
  }

  function drawBar() {
    var t = tamTinh();
    var part = function (lb, d, c, n, mx, extra) { return n ? '<span class="sumbox">' + lb + ' <b>' + f(d) + '</b>/' + f(mx) + ' <span class="muted" style="font-size:12px">' + (c < n ? '(chấm ' + c + '/' + n + ' câu)' : extra) + '</span></span>' : ''; };
    $('barSum').innerHTML = part('TN', t.tn, t.cTN, t.nTN, t.t.maxTN, '(' + t.dung + ' đúng' + (t.mot ? ' · ' + t.mot + ' đúng 1 phần' : '') + ' · ' + t.sai + ' sai)') + part('TL', t.tl, t.cTL, t.nTL, t.t.maxTL, '') +
      '<span class="sumbox">Tổng <b>' + f(t.tong) + '</b>/10</span>' +
      (dirty ? '<span class="badge b-amber">Chưa lưu</span>' : '<span class="badge b-green">Đã lưu</span>');
    var idx = dsHienTai.indexOf(B.maBai);
    $('btnSaveNext').classList.toggle('hidden', !(idx >= 0 && idx < dsHienTai.length - 1));
  }

  function luu(next) {
    var changed = B.items.filter(function (it) { return it.v !== it.diem || String(it.nx || '') !== String(it.nhanXet || ''); });
    var idx = dsHienTai.indexOf(B.maBai);
    if (!changed.length) { if (next && idx >= 0 && idx < dsHienTai.length - 1) moBai(dsHienTai[idx + 1]); else { $('barMsg').style.color = 'var(--muted)'; $('barMsg').textContent = 'Không có gì thay đổi'; } return; }
    var thieu = B.items.filter(function (it) { return it.v == null; }).length;
    $('btnSave').disabled = $('btnSaveNext').disabled = true;
    $('barMsg').style.color = 'var(--muted)'; $('barMsg').textContent = 'Đang lưu...';
    api({ action: 'chamBai', password: pass(), traVe: !next, items: changed.map(function (it) { return { row: it.row, maBai: B.maBai, id: it.id, diem: it.v == null ? '' : it.v, nhanXet: it.nx || '', max: it.loai === 'TL' ? r2(T().moiTL) : null }; }) })
      .then(function (r) {
        $('barMsg').style.color = 'var(--green)'; $('barMsg').textContent = 'Đã lưu ' + r.saved + ' câu' + (thieu ? ' · còn ' + thieu + ' câu chưa chấm' : ' · đã chấm xong bài');
        dirty = false;
        reloadData().catch(function () {});
        if (next) moBai(dsHienTai[idx + 1]);
        else if (r.bai) { setBai(r); var y = window.scrollY; renderBai(); window.scrollTo(0, y); }
      })
      .catch(function (ex) { $('barMsg').style.color = 'var(--red)'; $('barMsg').textContent = ex.message; })
      .then(function () { $('btnSave').disabled = $('btnSaveNext').disabled = false; });
  }
  $('btnSave').onclick = function () { luu(false); };
  $('btnSaveNext').onclick = function () { luu(true); };

  // ----- Bảng xếp hạng -----
  function tRank() {
    var phans = phansSel(), one = $('fPhan').value;
    var rows = nvSel().map(function (n) {
      var cells = phans.map(function (p) { var l = kqOf(n.ma, p.ma); return { lan: l.length, best: best(l), dat: l.some(function (k) { return isDat(k.kq); }) }; });
      var thi = cells.filter(function (c) { return c.lan; });
      var avg = thi.length ? thi.reduce(function (s, c) { return s + (c.best || 0); }, 0) / thi.length : null;
      return { n: n, cells: cells, datN: cells.filter(function (c) { return c.dat; }).length, avg: avg, lan: cells.reduce(function (s, c) { return s + c.lan; }, 0) };
    });
    rows.sort(function (a, b) { return (b.datN - a.datN) || ((b.avg || -1) - (a.avg || -1)) || (a.lan - b.lan); });
    var head = '<tr><th>Hạng</th><th>Mã NV</th><th>Tên</th><th>Nhóm</th>' +
      phans.map(function (p) { return '<th title="' + esc(p.ten) + '">' + esc(p.ma) + (one ? ' · Điểm cao nhất' : '') + '</th>'; }).join('') +
      (one ? '<th>Số lần thi</th>' : '<th>Số phần đạt</th><th>Điểm TB</th><th>Tổng lượt thi</th>') + '</tr>';
    var body = rows.map(function (r, i) {
      return '<tr><td><b>' + (r.lan ? i + 1 : '—') + '</b></td><td>' + esc(r.n.ma) + '</td><td>' + esc(r.n.ten) + '</td><td>' + esc(r.n.nhom) + '</td>' +
        r.cells.map(function (c) {
          if (!c.lan) return '<td><span class="badge b-gray">Chưa thi</span></td>';
          return '<td><span class="badge ' + (c.dat ? 'b-green' : 'b-red') + '">' + f(c.best) + '</span> <span class="muted" style="font-size:12px">' + c.lan + ' lần</span></td>';
        }).join('') +
        (one ? '<td>' + r.lan + '</td>' : '<td>' + r.datN + '/' + phans.length + '</td><td>' + f(r.avg) + '</td><td>' + r.lan + '</td>') + '</tr>';
    }).join('');
    return '<div class="scroll"><table class="sortable"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  // ----- Câu sai nhiều -----
  function tHard() {
    var v = $('fPhan').value, maSet = {};
    nvSel().forEach(function (n) { maSet[n.ma.toUpperCase()] = 1; });
    var list = D.cau.filter(function (c) { return !v || c.phan === v; }).map(function (c) {
      var who = D.sai.filter(function (s) { return s.id === c.id && maSet[s.ma.toUpperCase()]; });
      return { c: c, pct: c.luot ? c.sai / c.luot : 0, who: who };
    }).sort(function (a, b) { return b.pct - a.pct || b.c.sai - a.c.sai; });
    if (!list.length) return '<p class="muted">Chưa có dữ liệu.</p>';
    return '<p class="muted">Bấm vào một câu để xem ai sai. Tự luận tính là sai khi dưới 5 điểm.</p><div class="scroll"><table><thead><tr><th>Câu</th><th>Phần</th><th>Loại</th><th>Nội dung</th><th>Lượt làm</th><th>Lượt sai</th><th>% sai</th></tr></thead><tbody>' +
      list.map(function (x) {
        var names = {}; x.who.forEach(function (s) { names[s.ten] = (names[s.ten] || 0) + 1; });
        var det = Object.keys(names).map(function (t) { return esc(t) + (names[t] > 1 ? ' (' + names[t] + ' lần)' : ''); }).join(', ') || 'Không ai';
        return '<tr data-cau="' + esc(x.c.id) + '"><td>' + esc(x.c.id) + '</td><td>' + esc(x.c.phan) + '</td><td>' + esc(x.c.loai) + '</td><td>' + esc(x.c.text) + '</td><td>' + x.c.luot + '</td><td>' + x.c.sai + '</td>' +
          '<td><div class="row" style="flex-wrap:nowrap"><div class="pct"><div style="width:' + Math.round(x.pct * 100) + '%"></div></div><b>' + Math.round(x.pct * 100) + '%</b></div></td></tr>' +
          '<tr id="det-' + esc(x.c.id) + '" class="hidden"><td colspan="7" style="background:#fafbfd"><b>Người sai:</b> ' + det + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ----- Ai sai cái gì -----
  function tWho() {
    var opts = nvSel().map(function (n) {
      var c = D.sai.filter(function (s) { return s.ma.toUpperCase() === n.ma.toUpperCase(); }).length;
      return '<option value="' + esc(n.ma) + '">' + esc(n.ten + ' (' + n.ma + ')') + ' · ' + c + ' câu sai</option>';
    }).join('');
    var first = nvSel()[0];
    return '<div class="row" style="margin-bottom:12px"><select id="whoSel" style="max-width:420px">' + opts + '</select></div><div id="whoBody">' + (first ? whoBody(first.ma) : '') + '</div>';
  }
  function whoBody(ma) {
    var v = $('fPhan').value, cauMap = {};
    D.cau.forEach(function (c) { cauMap[c.id] = c; });
    var list = D.sai.filter(function (s) { return s.ma.toUpperCase() === ma.toUpperCase() && (!v || s.phan === v); })
      .sort(function (a, b) { return (b.tg || 0) - (a.tg || 0); });
    if (!list.length) return '<p class="muted">Không có câu sai nào.</p>';
    return '<div class="scroll"><table><thead><tr><th>Thời gian</th><th>Phần</th><th>Câu</th><th>Nội dung</th><th>Đã trả lời</th><th>Đáp án / Nhận xét</th></tr></thead><tbody>' +
      list.map(function (s) {
        var c = cauMap[s.id] || {};
        var right = s.loai === 'TN' ? '<b style="color:var(--green)">' + esc(s.dapAn) + '</b>' : '<span class="badge b-red">' + f(s.diem) + '/10</span> ' + esc(s.nhanXet);
        var ans = s.loai === 'TN' ? '<b style="color:var(--red)">' + (esc(s.traLoi) || '(bỏ trống)') + '</b>' : '<div style="max-height:120px;overflow:auto;white-space:pre-line">' + esc(s.traLoi) + '</div>';
        return '<tr><td>' + dt(s.tg) + '</td><td>' + esc(s.phan) + '</td><td>' + esc(s.id) + '</td><td>' + esc(c.text) + '</td><td>' + ans + '</td><td>' + right + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="muted" style="font-size:13px">Chữ cái đáp án theo thứ tự gốc trong ngân hàng câu hỏi (cột E–H), không phải thứ tự đã trộn trên đề.</p>';
  }

  // ----- Chưa thi / chưa đạt -----
  function tNot() {
    var phans = phansSel(), nvs = nvSel();
    return phans.map(function (p) {
      var chua = [], chuaDat = [];
      nvs.forEach(function (n) {
        var l = kqOf(n.ma, p.ma);
        if (!l.length) chua.push(n); else if (!l.some(function (k) { return isDat(k.kq); })) chuaDat.push({ n: n, lan: l.length, best: best(l) });
      });
      return '<div class="card" style="padding:14px"><h3>' + esc(p.ma + '. ' + p.ten) + '</h3>' +
        '<p><span class="badge b-red">Chưa thi: ' + chua.length + '</span> ' + chua.map(function (n) { return esc(n.ten) + ' <span class="muted">(' + esc(n.nhom) + ')</span>'; }).join(', ') + '</p>' +
        '<p><span class="badge b-amber">Đã thi, chưa đạt: ' + chuaDat.length + '</span> ' + chuaDat.map(function (x) { return esc(x.n.ten) + ' <span class="muted">(' + f(x.best) + 'đ, ' + x.lan + ' lần)</span>'; }).join(', ') + '</p></div>';
    }).join('') || '<p class="muted">Không có phần thi.</p>';
  }

  // ----- Lịch sử -----
  function tLog() {
    var v = $('fPhan').value, maSet = {};
    nvSel().forEach(function (n) { maSet[n.ma.toUpperCase()] = 1; });
    var list = D.ketQua.filter(function (k) { return maSet[k.ma.toUpperCase()] && (!v || k.phan === v); }).sort(function (a, b) { return (b.tg || 0) - (a.tg || 0); });
    if (!list.length) return '<p class="muted">Chưa có lượt thi.</p>';
    return '<div class="scroll"><table class="sortable"><thead><tr><th>Thời gian</th><th>Mã NV</th><th>Tên</th><th>Phần</th><th>Lần</th><th>Mã đề</th><th>TN</th><th>TL</th><th>Tổng</th><th>Kết quả</th><th>Phút</th></tr></thead><tbody>' +
      list.map(function (k) {
        var cls = isDat(k.kq) ? 'b-green' : (k.tong == null ? 'b-amber' : 'b-red');
        return '<tr><td data-v="' + (k.tg || 0) + '">' + dt(k.tg) + '</td><td>' + esc(k.ma) + '</td><td>' + esc(k.ten) + '</td><td>' + esc(k.phan) + '</td><td>' + k.lan + '</td><td>' + esc(k.maDe) + '</td><td>' + f(k.tn) + '</td><td>' + f(k.tl) + '</td><td><b>' + f(k.tong) + '</b></td><td><span class="badge ' + cls + '">' + esc(k.kq) + '</span></td><td>' + f(k.phut) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ----- Sắp xếp bảng khi bấm tiêu đề -----
  function bindSort() {
    Array.prototype.forEach.call(document.querySelectorAll('table.sortable th'), function (th, idx) {
      th.onclick = function () {
        var tb = th.closest('table').tBodies[0], rows = Array.prototype.slice.call(tb.rows);
        var asc = sortState.idx === idx ? !sortState.asc : false; sortState = { idx: idx, asc: asc };
        function val(tr) { var td = tr.cells[idx]; var v = td.getAttribute('data-v') || td.textContent.trim().replace(',', '.'); var n = parseFloat(v); return isNaN(n) ? v.toLowerCase() : n; }
        rows.sort(function (a, b) { var x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1); });
        rows.forEach(function (r) { tb.appendChild(r); });
      };
    });
  }
})();
</script>
</body>
</html>
